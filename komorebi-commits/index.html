<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>komorebi commits — your GitHub year as dappled light</title>
<meta name="description" content="Your GitHub contribution graph rendered as sunlight through leaves. Each day you committed is a gap in the canopy.">
<style>
  :root {
    --ink: #e9dfcc;
    --ink-dim: rgba(233, 223, 204, 0.55);
    --ink-faint: rgba(233, 223, 204, 0.32);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #3d3833; }
  body {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    color: var(--ink);
  }
  canvas#scene { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

  .ui { position: fixed; z-index: 10; }

  header.ui {
    top: 28px; left: 32px;
    user-select: none;
  }
  header h1 {
    font-size: 15px; font-weight: 400; letter-spacing: 0.22em;
    text-transform: lowercase; color: var(--ink-dim);
  }
  header h1 .jp { letter-spacing: 0.1em; margin-left: 8px; color: var(--ink-faint); }

  form.ui {
    top: 26px; right: 32px;
    display: flex; align-items: baseline; gap: 8px;
  }
  form .at { color: var(--ink-faint); font-size: 15px; }
  form input {
    background: transparent; border: none; outline: none;
    border-bottom: 1px solid rgba(233, 223, 204, 0.25);
    color: var(--ink); font: italic 16px inherit;
    font-family: inherit;
    padding: 2px 2px 4px; width: 150px;
    transition: border-color 0.3s;
  }
  form input:focus { border-color: rgba(233, 223, 204, 0.6); }
  form input::placeholder { color: var(--ink-faint); font-style: italic; }

  footer.ui {
    bottom: 24px; left: 32px; right: 32px;
    display: flex; justify-content: space-between; align-items: flex-end;
    font-size: 12.5px; color: var(--ink-faint);
    pointer-events: none;
  }
  footer .credit { font-style: italic; line-height: 1.6; }
  footer .credit a { color: var(--ink-dim); text-decoration: none; border-bottom: 1px dotted rgba(233,223,204,0.3); pointer-events: auto; }
  footer .actions { display: flex; gap: 18px; pointer-events: auto; }
  footer button {
    background: none; border: none; cursor: pointer;
    font-family: inherit; font-size: 12.5px; letter-spacing: 0.08em;
    color: var(--ink-dim); padding: 4px 0;
    border-bottom: 1px solid transparent;
    transition: color 0.25s, border-color 0.25s;
  }
  footer button:hover { color: var(--ink); border-bottom-color: rgba(233,223,204,0.4); }

  #tooltip {
    position: fixed; z-index: 20; pointer-events: none;
    font-size: 13px; font-style: italic; color: var(--ink);
    background: rgba(30, 27, 24, 0.82);
    padding: 6px 12px; border-radius: 2px;
    opacity: 0; transition: opacity 0.2s;
    white-space: nowrap;
    transform: translate(-50%, -160%);
  }

  #notice {
    position: fixed; top: 64px; right: 32px; z-index: 10;
    font-size: 12.5px; font-style: italic; color: var(--ink-faint);
    max-width: 260px; text-align: right; line-height: 1.5;
    opacity: 0; transition: opacity 0.6s;
  }
  #notice.show { opacity: 1; }

  #toast {
    position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%);
    z-index: 30; font-size: 13px; font-style: italic;
    color: var(--ink); background: rgba(30, 27, 24, 0.85);
    padding: 8px 18px; border-radius: 2px;
    opacity: 0; transition: opacity 0.4s;
  }
  #toast.show { opacity: 1; }

  @media (max-width: 640px) {
    header.ui { left: 20px; top: 20px; }
    form.ui { right: 20px; top: 18px; }
    footer.ui { left: 20px; right: 20px; bottom: 18px; flex-direction: column; gap: 10px; align-items: flex-start; }
    #notice { right: 20px; top: 56px; }
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<header class="ui">
  <h1>dappled commits<span class="jp">木漏れ日</span></h1>
</header>

<form class="ui" id="userForm">
  <span class="at">@</span>
  <input id="userInput" type="text" placeholder="github username" autocomplete="off" spellcheck="false" aria-label="GitHub username">
</form>

<div id="notice"></div>
<div id="tooltip"></div>
<div id="toast"></div>

<footer class="ui">
  <div class="credit">
    light through a year of commits · after <a href="https://jzhao.xyz/posts/dappled-light" target="_blank" rel="noopener">“dappled light”</a> by jacky zhao
  </div>
  <div class="actions">
    <button id="btnEclipse" title="during an eclipse, every gap in the leaves projects a crescent sun">☾ eclipse</button>
    <button id="btnShare">copy link</button>
    <button id="btnSave">save image</button>
  </div>
</footer>

<script>
'use strict';

/* ============================================================
   komorebi commits — a GitHub contribution graph as dappled light
   Each day with commits is a gap in the canopy; sunlight leaks
   through and sways on the wall. During an eclipse, every gap
   becomes a pinhole camera projecting a crescent sun.
   ============================================================ */

const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');
const notice = document.getElementById('notice');
const toast = document.getElementById('toast');
const userInput = document.getElementById('userInput');

const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;

let W = 0, H = 0, DPR = 1;
let cell = 14;               // px per week-column at current size
let originX = 0, originY = 0; // top-left of the 53×7 light field
let blobs = [];              // animated light patches (one per active day)
let meta = { user: '', total: 0, streak: 0, busiest: null, demo: false };
let eclipse = { active: false, t0: 0, dur: 26 };
let toastTimer = null;

/* ---------- tiny deterministic hash → [0,1) ---------- */
function hash(n) {
  const s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return s - Math.floor(s);
}

/* ---------- data ---------- */

async function fetchContributions(user) {
  const res = await fetch(
    `https://github-contributions-api.jogruber.de/v4/${encodeURIComponent(user)}?y=last`,
    { headers: { Accept: 'application/json' } }
  );
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  if (!json.contributions || !json.contributions.length) throw new Error('empty');
  return json.contributions.map(c => ({ date: c.date, count: c.count, level: c.level }));
}

/* A believable year of demo data: weekday rhythm, bursts, quiet stretches. */
function demoContributions() {
  const days = [];
  const today = new Date();
  const start = new Date(today); start.setDate(start.getDate() - 364);
  let burst = 0;
  for (let i = 0; i < 365; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const dow = d.getDay();
    const weekend = dow === 0 || dow === 6;
    if (hash(i * 3.7) < 0.03) burst = 4 + Math.floor(hash(i * 9.1) * 8); // project sprint
    let p = weekend ? 0.22 : 0.72;
    p *= 0.7 + 0.3 * Math.sin(i / 58 + 1.2);          // seasonal ebb
    if (hash(i * 1.3) < 0.05) p = 0;                   // days off
    let count = 0;
    if (hash(i * 5.9) < p) {
      count = 1 + Math.floor(Math.pow(hash(i * 7.3), 2) * 9);
      if (burst > 0) { count += 3 + Math.floor(hash(i * 2.2) * 6); burst--; }
    }
    const level = count === 0 ? 0 : count < 3 ? 1 : count < 6 ? 2 : count < 10 ? 3 : 4;
    days.push({ date: d.toISOString().slice(0, 10), count, level });
  }
  return days;
}

function computeStats(days) {
  let total = 0, streak = 0, best = 0, busiest = null;
  for (const d of days) {
    total += d.count;
    if (d.count > 0) { streak++; best = Math.max(best, streak); } else streak = 0;
    if (!busiest || d.count > busiest.count) busiest = d;
  }
  return { total, streak: best, busiest };
}

/* ---------- build the light field ---------- */

function buildBlobs(days) {
  // p90 of nonzero counts → continuous brightness scale
  const counts = days.filter(d => d.count > 0).map(d => d.count).sort((a, b) => a - b);
  const p90 = counts.length ? counts[Math.floor(counts.length * 0.9)] : 1;

  // lay out into week columns ending today, like GitHub's graph
  const last = new Date(days[days.length - 1].date + 'T12:00:00');
  const lastDow = last.getDay();

  blobs = [];
  for (let i = 0; i < days.length; i++) {
    const d = days[i];
    const date = new Date(d.date + 'T12:00:00');
    const daysAgo = Math.round((last - date) / 86400000);
    const week = Math.floor((daysAgo + lastDow) / 7); // 0 = current week
    d.week = week; d.dow = date.getDay();
    if (d.count === 0) continue;

    const v = Math.min(1, 0.5 * (d.level / 4) + 0.5 * (d.count / p90));
    const seed = i * 13.37;
    blobs.push({
      date: d.date, count: d.count,
      week, dow: d.dow, v,
      jx: (hash(seed + 1) - 0.5) * 0.5,      // organic jitter, in cells
      jy: (hash(seed + 2) - 0.5) * 0.5,
      p1: hash(seed + 3) * Math.PI * 2,      // wind phases
      p2: hash(seed + 4) * Math.PI * 2,
      p3: hash(seed + 5) * Math.PI * 2,
      fj: 0.75 + hash(seed + 6) * 0.6,       // frequency jitter
      amp: 0.55 + hash(seed + 7) * 0.55,     // sway amplitude, in cells
      hue: hash(seed + 8),                    // warm ↔ pale variation
    });
  }
  layout();
}

function maxWeek() { return blobs.length ? Math.max(53, ...blobs.map(b => b.week + 1)) : 53; }

function layout() {
  const weeks = maxWeek();
  const availW = Math.min(W * 0.86, 1400);
  cell = availW / weeks;
  const gw = weeks * cell, gh = 7 * cell;
  originX = (W - gw) / 2;
  originY = H * 0.46 - gh / 2;
}

function blobBase(b) {
  const weeks = maxWeek();
  return {
    x: originX + (weeks - 1 - b.week + 0.5 + b.jx) * cell,
    y: originY + (b.dow + 0.5 + b.jy) * cell,
  };
}

/* ---------- wind ---------- */

function gust(t) {
  const g = 0.6 * Math.sin(t * 0.23 + 1.7) + 0.4 * Math.sin(t * 0.071) + 0.25 * Math.sin(t * 0.53 + 4.1);
  return Math.min(1, Math.max(0, 0.55 + 0.45 * g));
}

function blobPos(b, t) {
  const base = blobBase(b);
  const G = gust(t);
  const sway = 0.35 + 0.65 * G;
  const a = b.amp * cell * 0.5;
  return {
    x: base.x + (Math.sin(t * 0.9 * b.fj + b.p1) + 0.5 * Math.sin(t * 1.9 * b.fj + b.p2)) * a * sway,
    y: base.y + (Math.sin(t * 0.7 * b.fj + b.p2) + 0.5 * Math.sin(t * 1.5 * b.fj + b.p3)) * a * 0.6 * sway,
  };
}

/* ---------- rendering ---------- */

const lightCanvas = document.createElement('canvas');
const lightCtx = lightCanvas.getContext('2d');
const scratch = document.createElement('canvas');
const scratchCtx = scratch.getContext('2d');
let grain = null;

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  lightCanvas.width = W * DPR; lightCanvas.height = H * DPR;
  makeGrain();
  layout();
}

function makeGrain() {
  grain = document.createElement('canvas');
  grain.width = 220; grain.height = 220;
  const g = grain.getContext('2d');
  const img = g.createImageData(220, 220);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 118 + Math.random() * 20;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
    img.data[i + 3] = 14;
  }
  g.putImageData(img, 0, 0);
}

function drawLightBlob(c, x, y, r, alpha, hue, crescent) {
  const warm = hue < 0.65;
  const inner = warm ? '255,247,218' : '255,251,236';
  const mid   = warm ? '255,208,128' : '255,226,168';
  const outer = warm ? '255,158,58'  : '255,190,110';

  const paint = (g2, cx, cy) => {
    const grad = g2.createRadialGradient(cx, cy, 0, cx, cy, r);
    grad.addColorStop(0, `rgba(${inner},${alpha})`);
    grad.addColorStop(0.38, `rgba(${mid},${alpha * 0.75})`);
    grad.addColorStop(1, `rgba(${outer},0)`);
    g2.fillStyle = grad;
    g2.beginPath(); g2.arc(cx, cy, r, 0, Math.PI * 2); g2.fill();
  };

  if (!crescent || crescent.c <= 0.02) {
    paint(c, x, y);
    return;
  }
  // pinhole eclipse: punch an offset disc out of the blob
  const s = Math.ceil(r * 2.4);
  if (scratch.width < s * 2) { scratch.width = s * 2; scratch.height = s * 2; }
  scratchCtx.clearRect(0, 0, scratch.width, scratch.height);
  paint(scratchCtx, s, s);
  scratchCtx.globalCompositeOperation = 'destination-out';
  const off = r * (1.55 - 1.25 * crescent.c);
  const mg = scratchCtx.createRadialGradient(
    s + off * crescent.dx, s + off * crescent.dy, r * 0.1,
    s + off * crescent.dx, s + off * crescent.dy, r * 0.98);
  mg.addColorStop(0, 'rgba(0,0,0,1)');
  mg.addColorStop(0.75, 'rgba(0,0,0,1)');
  mg.addColorStop(1, 'rgba(0,0,0,0)');
  scratchCtx.fillStyle = mg;
  scratchCtx.beginPath();
  scratchCtx.arc(s + off * crescent.dx, s + off * crescent.dy, r * 0.98, 0, Math.PI * 2);
  scratchCtx.fill();
  scratchCtx.globalCompositeOperation = 'source-over';
  c.drawImage(scratch, 0, 0, s * 2, s * 2, x - s, y - s, s * 2, s * 2);
}

/* soft dark foliage masses that frame the scene and sway */
function drawFoliage(c, t) {
  const G = gust(t);
  const clusters = [
    { x: 0.04, y: -0.05, r: 0.42, f: 0.31, p: 0.5, a: 0.5 },
    { x: 0.30, y: -0.14, r: 0.34, f: 0.23, p: 2.1, a: 0.38 },
    { x: 0.97, y: -0.03, r: 0.40, f: 0.27, p: 4.0, a: 0.46 },
    { x: 0.80, y: 1.10,  r: 0.36, f: 0.19, p: 1.2, a: 0.34 },
    { x: -0.02, y: 0.95, r: 0.33, f: 0.25, p: 3.3, a: 0.36 },
  ];
  c.save();
  c.globalCompositeOperation = 'multiply';
  for (const cl of clusters) {
    const sx = cl.x * W + Math.sin(t * cl.f + cl.p) * 26 * (0.4 + 0.6 * G);
    const sy = cl.y * H + Math.sin(t * cl.f * 0.7 + cl.p + 1) * 14 * (0.4 + 0.6 * G);
    const r = cl.r * Math.max(W, H) * 0.55;
    const g = c.createRadialGradient(sx, sy, 0, sx, sy, r);
    g.addColorStop(0, `rgba(26, 30, 22, ${cl.a})`);
    g.addColorStop(0.6, `rgba(30, 33, 26, ${cl.a * 0.5})`);
    g.addColorStop(1, 'rgba(40, 40, 36, 0)');
    c.fillStyle = g;
    c.beginPath(); c.arc(sx, sy, r, 0, Math.PI * 2); c.fill();
  }
  c.restore();
}

function monthLabels() {
  // returns [{week, label}] where a month begins
  const out = [];
  let lastMonth = -1;
  const byWeek = new Map();
  for (const b of blobs) {
    if (!byWeek.has(b.week)) byWeek.set(b.week, b.date);
  }
  const weeks = maxWeek();
  for (let w = weeks - 1; w >= 0; w--) {
    const dateStr = byWeek.get(w);
    if (!dateStr) continue;
    const m = new Date(dateStr + 'T12:00:00').getMonth();
    if (m !== lastMonth) {
      out.push({ week: w, label: new Date(dateStr + 'T12:00:00').toLocaleString('en', { month: 'short' }).toLowerCase() });
      lastMonth = m;
    }
  }
  return out;
}

let cachedMonths = [];

function eclipseState(t) {
  if (!eclipse.active) return null;
  const e = (t - eclipse.t0) / eclipse.dur;
  if (e >= 1) { eclipse.active = false; return null; }
  const c = Math.sin(e * Math.PI);               // 0 → 1 → 0
  const ang = -0.6 + e * 1.2;                     // moon slides across
  return { c, dx: Math.cos(ang), dy: Math.sin(ang) * 0.6, e };
}

function render(t) {
  const c = ctx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);

  const ec = eclipseState(t);
  const dim = ec ? 1 - 0.45 * ec.c : 1; // world darkens mid-eclipse

  // wall in shadow
  const wall = c.createLinearGradient(0, 0, 0, H);
  wall.addColorStop(0, `rgb(${Math.round(74 * dim)}, ${Math.round(68 * dim)}, ${Math.round(62 * dim)})`);
  wall.addColorStop(0.55, `rgb(${Math.round(64 * dim)}, ${Math.round(59 * dim)}, ${Math.round(54 * dim)})`);
  wall.addColorStop(1, `rgb(${Math.round(52 * dim)}, ${Math.round(49 * dim)}, ${Math.round(46 * dim)})`);
  c.fillStyle = wall;
  c.fillRect(0, 0, W, H);

  // the light field
  const lc = lightCtx;
  lc.setTransform(DPR, 0, 0, DPR, 0, 0);
  lc.clearRect(0, 0, W, H);
  lc.globalCompositeOperation = 'lighter';
  const G = gust(t);
  for (const b of blobs) {
    const pos = blobPos(b, t);
    const flicker = 0.78 + 0.22 * Math.sin(t * 1.3 * b.fj + b.p3);
    const r = cell * (0.55 + 1.5 * b.v);
    const alpha = (0.30 + 0.50 * b.v) * flicker * (0.82 + 0.18 * G);
    drawLightBlob(lc, pos.x, pos.y, r, alpha, b.hue, ec);
    if (b.v > 0.72) { // brightest days spill a second, offset patch
      drawLightBlob(lc, pos.x + cell * 0.5, pos.y - cell * 0.35, r * 0.55, alpha * 0.5, 1 - b.hue, ec);
    }
  }
  lc.globalCompositeOperation = 'source-over';

  c.globalCompositeOperation = 'screen';
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.drawImage(lightCanvas, 0, 0);
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.globalCompositeOperation = 'source-over';

  drawFoliage(c, t);

  // grain + vignette
  c.save();
  c.globalAlpha = 0.5;
  c.fillStyle = c.createPattern(grain, 'repeat');
  c.fillRect(0, 0, W, H);
  c.restore();
  const vg = c.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(15,13,11,0.42)');
  c.fillStyle = vg;
  c.fillRect(0, 0, W, H);

  drawText(c);
}

function drawText(c) {
  const weeks = maxWeek();
  const gh = 7 * cell;

  // month markers under the band
  c.save();
  c.fillStyle = 'rgba(233, 223, 204, 0.30)';
  c.font = `${Math.max(10, cell * 0.62)}px "Iowan Old Style", Palatino, Georgia, serif`;
  c.textAlign = 'left';
  for (const m of cachedMonths) {
    const x = originX + (weeks - 1 - m.week) * cell;
    c.fillText(m.label, x, originY + gh + cell * 1.6);
  }
  c.restore();

  if (!meta.user) return;
  // caption, like a museum placard
  const cy = originY + gh + cell * 4.2;
  c.save();
  c.textAlign = 'center';
  c.fillStyle = 'rgba(233, 223, 204, 0.85)';
  c.font = `italic ${Math.min(26, Math.max(17, W * 0.017))}px "Iowan Old Style", Palatino, Georgia, serif`;
  c.fillText(`@${meta.user}`, W / 2, cy);
  c.fillStyle = 'rgba(233, 223, 204, 0.45)';
  c.font = `${Math.min(14.5, Math.max(11.5, W * 0.0095))}px "Iowan Old Style", Palatino, Georgia, serif`;
  const parts = [`${meta.total.toLocaleString()} contributions in the last year`];
  if (meta.streak > 1) parts.push(`longest streak ${meta.streak} days`);
  if (meta.demo) parts.push('demo data');
  c.fillText(parts.join('  ·  '), W / 2, cy + Math.max(20, W * 0.014));
  c.restore();
}

/* ---------- animation loop ---------- */

let start = performance.now();
function frame(now) {
  const t = REDUCED_MOTION ? 12.0 : (now - start) / 1000;
  render(t);
  if (!REDUCED_MOTION || eclipse.active) requestAnimationFrame(frame);
}

/* ---------- interactions ---------- */

canvas.addEventListener('pointermove', (e) => {
  const t = REDUCED_MOTION ? 12.0 : (performance.now() - start) / 1000;
  let bestB = null, bestD = Infinity;
  for (const b of blobs) {
    const p = blobPos(b, t);
    const d = Math.hypot(p.x - e.clientX, p.y - e.clientY);
    if (d < bestD) { bestD = d; bestB = b; }
  }
  if (bestB && bestD < cell * 1.4) {
    const d = new Date(bestB.date + 'T12:00:00');
    const label = d.toLocaleDateString('en', { month: 'long', day: 'numeric' });
    tooltip.textContent = `${label} — ${bestB.count} contribution${bestB.count === 1 ? '' : 's'}`;
    tooltip.style.left = e.clientX + 'px';
    tooltip.style.top = e.clientY + 'px';
    tooltip.style.opacity = 1;
  } else {
    tooltip.style.opacity = 0;
  }
});
canvas.addEventListener('pointerleave', () => { tooltip.style.opacity = 0; });

function startEclipse() {
  eclipse.active = true;
  eclipse.t0 = (performance.now() - start) / 1000;
  if (REDUCED_MOTION) requestAnimationFrame(frame);
  showToast('the moon passes — every gap in the leaves becomes a pinhole camera');
}
document.getElementById('btnEclipse').addEventListener('click', startEclipse);
document.addEventListener('keydown', (e) => {
  if (e.key === 'e' && document.activeElement !== userInput) startEclipse();
});

document.getElementById('btnShare').addEventListener('click', async () => {
  const url = new URL(location.href);
  url.search = meta.user && !meta.demo ? `?user=${encodeURIComponent(meta.user)}` : '';
  try {
    await navigator.clipboard.writeText(url.toString());
    showToast('link copied — send someone your light');
  } catch {
    showToast(url.toString());
  }
});

document.getElementById('btnSave').addEventListener('click', () => {
  const a = document.createElement('a');
  a.download = `komorebi-${meta.user || 'commits'}.png`;
  a.href = canvas.toDataURL('image/png');
  a.click();
  showToast('saved');
});

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 3200);
}

/* ---------- load flow ---------- */

async function load(user, { pushUrl = true } = {}) {
  notice.classList.remove('show');
  let days, demo = false;
  if (user) {
    try {
      days = await fetchContributions(user);
    } catch (err) {
      demo = true;
      notice.textContent = `couldn’t reach the contributions api for @${user} — showing an imagined year instead`;
      notice.classList.add('show');
    }
  } else {
    demo = true;
  }
  if (demo) days = demoContributions();

  const stats = computeStats(days);
  meta = { user: user || 'someone', total: stats.total, streak: stats.streak, busiest: stats.busiest, demo };
  buildBlobs(days);
  cachedMonths = monthLabels();

  if (pushUrl && user && !demo) {
    const url = new URL(location.href);
    url.searchParams.set('user', user);
    history.replaceState(null, '', url);
  }
  document.title = user
    ? `@${user} — komorebi commits`
    : 'komorebi commits — your GitHub year as dappled light';
  if (REDUCED_MOTION) requestAnimationFrame(frame);
}

document.getElementById('userForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const u = userInput.value.trim().replace(/^@/, '');
  if (u) load(u);
  userInput.blur();
});

window.addEventListener('resize', () => { resize(); if (REDUCED_MOTION) requestAnimationFrame(frame); });

/* ---------- boot ---------- */

resize();
const params = new URLSearchParams(location.search);
const initialUser = (params.get('user') || '').trim().replace(/^@/, '');
const forceDemo = params.has('demo');
if (initialUser) userInput.value = initialUser;

load(forceDemo ? '' : initialUser, { pushUrl: false });
requestAnimationFrame(frame);
</script>
</body>
